<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<!-- Mobile-first viewport: no pinch-zoom weirdness, notch-safe -->
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>SlutCamp — Live Chat & Private Video with Independent Models | 18+</title>
<meta name="description" content="SlutCamp is an 18+ live entertainment community where fans connect with independent models through live shows, private chat, one-on-one video calls, fan clubs, and exclusive content. Join free and meet them live.">
<meta name="robots" content="index, follow">
<link rel="canonical" href="https://slutcamp.app/">
<!-- Open Graph -->
<meta property="og:type" content="website">
<meta property="og:site_name" content="SlutCamp">
<meta property="og:title" content="SlutCamp — Live Chat & Private Video with Independent Models | 18+">
<meta property="og:description" content="SlutCamp is an 18+ live entertainment community where fans connect with independent models through live shows, private chat, one-on-one video calls, fan clubs, and exclusive content. Join free and meet them live.">
<meta property="og:url" content="https://slutcamp.app/">
<meta property="og:image" content="https://slutcamp.app/img/lips-logo.png">
<meta property="og:image:type" content="image/png">
<meta property="og:image:width" content="512">
<meta property="og:image:height" content="512">
<!-- Twitter -->
<meta name="twitter:card" content="summary">
<meta name="twitter:title" content="SlutCamp — Live Chat & Private Video with Independent Models | 18+">
<meta name="twitter:description" content="SlutCamp is an 18+ live entertainment community where fans connect with independent models through live shows, private chat, one-on-one video calls, fan clubs, and exclusive content. Join free and meet them live.">
<meta name="twitter:image" content="https://slutcamp.app/img/lips-logo.png">
<meta name="theme-color" content="#150b26">
<!-- Favicon: the SlutCamp lips logo (shown by Google next to the site name in search results) -->
<link rel="icon" type="image/png" sizes="512x512" href="/img/lips-logo.png">
<link rel="icon" type="image/png" sizes="192x192" href="/icons/icon-192.png">
<!-- Structured data for Google -->
<script type="application/ld+json">
{
  "@context": "https://schema.org",
  "@graph": [
    {
      "@type": "Organization",
      "name": "SlutCamp",
      "url": "https://slutcamp.app/",
      "logo": "https://slutcamp.app/img/lips-logo.png",
      "description": "SlutCamp is an 18+ live entertainment community where fans connect with independent models through live shows, private chat, one-on-one video calls, fan clubs, and exclusive content."
    },
    {
      "@type": "WebSite",
      "name": "SlutCamp",
      "url": "https://slutcamp.app/"
    }
  ]
}
</script>
<!-- PWA -->
<link rel="manifest" href="/manifest.json">
<link rel="apple-touch-icon" href="/icons/icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="SlutCamp">
<!-- Welcome-splash badge animation: start the 916KB animated WebP
     downloading with the page itself, so the lips are already moving
     the moment the splash badge renders — on every open. -->
<link rel="preload" as="image" type="image/webp" href="/img/logo-lips-anim.webp">
<link rel="stylesheet" href="/css/styles.css?v=20261012lang">
<script src="/js/theme.js" defer></script>
</head>
<body>
<!-- 18+ age gate: shown before anything else until confirmed -->
<div id="age-gate" class="hidden">
  <div class="age-gate-card">
    <h1 class="age-gate-logo">SLUT<span>CAMP</span></h1>
    <div class="age-gate-q" id="gate-q">VERIFY YOUR AGE</div>
    <p class="age-gate-sub" id="gate-sub">Enter your date of birth. You must be 18 or older to enter.</p>
    <form id="age-form">
      <input id="age-dob" type="date" class="age-input" min="1900-01-01" required>
      <!-- Language at the door: app.js fills this picker in below the
           age input, before she enters anything (EN/ES/PT). -->
      <div class="lang-row" id="gate-lang"></div>
      <p id="age-error" class="age-error hidden"></p>
      <button type="submit" class="btn age-yes" id="gate-btn" style="width:100%;margin-top:12px">VERIFY & ENTER</button>
    </form>
  </div>
</div>

<!-- The whole app renders inside #app. Simple on purpose. -->
<div id="phone">
  <div id="app"></div>
  <nav id="tabbar" class="hidden"></nav>
</div>

<!-- Incoming call overlay -->
<div id="call-overlay" class="hidden">
  <div class="call-card">
    <div id="call-avatar" class="avatar xl"></div>
    <h2 id="call-name">Incoming call</h2>
    <p id="call-sub" class="muted">Video call</p>
    <div class="call-actions">
      <button id="call-decline" class="btn-call decline" aria-label="Decline">✕</button>
      <button id="call-accept" class="btn-call accept" aria-label="Accept">📞</button>
    </div>
  </div>
</div>

<!-- Active call screen -->
<div id="active-call" class="hidden">
  <video id="remote-video" autoplay playsinline></video>
  <video id="local-video" autoplay playsinline muted></video>
  <div id="call-status" class="hidden"></div>
  <div id="call-join-timer" class="hidden"></div>
  <div class="call-hud">
    <div id="call-timer">00:00</div>
    <div id="call-cost" class="muted">$0.00</div>
    <button id="call-hangup" class="btn-call decline">✕</button>
  </div>
</div>

<!-- Call could not start (camera/mic blocked or connect failed) -->
<div id="call-error" class="hidden">
  <div class="call-card">
    <h2 id="call-error-title">📹 Camera blocked</h2>
    <p id="call-error-text" class="muted"></p>
    <div class="call-actions">
      <button id="call-error-end" class="btn ghost">End call</button>
      <button id="call-error-retry" class="btn">Try again</button>
    </div>
  </div>
</div>

<!-- Toast notifications -->
<div id="toast" class="hidden"></div>

<!-- Install banner (Android/Chrome). iOS gets manual instructions. -->
<div id="install-banner" class="hidden">
  <span>📲 Install SlutCamp on your home screen</span>
  <button id="install-btn" class="btn small">Install</button>
  <button id="install-dismiss" class="btn small ghost">Later</button>
</div>

<script src="/js/app.js?v=20261015recruitlang"></script>
<script>
  // Register the service worker (offline app shell). Fails silently if unsupported.
  if ('serviceWorker' in navigator) {
    window.addEventListener('load', () => {
      navigator.serviceWorker.register('/sw.js').catch(() => {});
    });
  }
</script>
</body>
</html>
